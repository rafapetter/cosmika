# CI for the public repository (GitHub Actions). Exported to
# .github/workflows/ci.yml by scripts/export-oss.sh.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck --filter='!@cosmika/proto'
      - run: pnpm --filter @cosmika/api exec vitest run
      - run: pnpm --filter @cosmika/web exec vitest run
      - run: pnpm --filter @cosmika/web build

  realtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/realtime/go.mod
      - run: go test ./...
