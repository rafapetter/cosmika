syntax = "proto3";

package cosmika.events.v1;

option go_package = "github.com/cosmoorg/cosmika/packages/proto/gen/go/cosmika/events/v1;eventsv1";

import "google/protobuf/timestamp.proto";

// MessageCreated is emitted whenever a message lands in any conversation.
// Consumers: realtime (websocket fanout), api (orchestrator triggers),
// whatsapp-ingest (echo handling).
message MessageCreated {
  string account_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  string sender_id = 4;
  SenderType sender_type = 5;
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ConversationStatusChanged {
  string account_id = 1;
  string conversation_id = 2;
  ConversationStatus old_status = 3;
  ConversationStatus new_status = 4;
  string actor_id = 5;
  google.protobuf.Timestamp changed_at = 6;
}

enum SenderType {
  SENDER_TYPE_UNSPECIFIED = 0;
  SENDER_TYPE_CONTACT = 1;
  SENDER_TYPE_USER = 2;
  SENDER_TYPE_AGENT_BOT = 3;
  SENDER_TYPE_SYSTEM = 4;
}

enum ConversationStatus {
  CONVERSATION_STATUS_UNSPECIFIED = 0;
  CONVERSATION_STATUS_OPEN = 1;
  CONVERSATION_STATUS_RESOLVED = 2;
  CONVERSATION_STATUS_PENDING = 3;
  CONVERSATION_STATUS_SNOOZED = 4;
}
